# docker-compose.yml
# Orchestrates all three services of the Task Management Application:
#   - frontend  (React, built + served, port 5173)
#   - backend   (Node/Express API, port 5000)
#   - mongodb   (official Mongo image, port 27017)
#
# All services share the internal bridge network "app-network" so they can
# reach each other by service name (e.g. backend connects to
# mongodb://mongodb:27017 and frontend proxies /api → http://backend:5000).
#
# Usage:
#   docker-compose up --build        # first run — build images + start
#   docker-compose up                # subsequent runs — start existing images
#   docker-compose down              # stop and remove containers
#   docker-compose down -v           # also remove the MongoDB data volume

version: '3.9'

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: task_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume — data persists across docker-compose down / up cycles
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node/Express) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Override the local .env values so the backend talks to the
      # mongodb container (service name is resolved inside app-network)
      MONGO_URI: mongodb://mongodb:27017/task_management
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-taskmanager_super_secret_key_2026}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ── Frontend (React) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
